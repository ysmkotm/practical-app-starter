<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
	<meta charset="UTF-8">
	<title>TOP | Practical App Starter</title>
	<th:block th:replace="~{fragments/css :: css}"></th:block>
</head>
<body>
	<th:block th:replace="~{fragments/header :: header}"></th:block>

	<div class="d-flex">
		<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

		<main class="app-main">
			<div class="mb-3">
				<h1 class="h3">TOP</h1>
				<p class="text-muted mb-0">
					実践的な業務システム開発のスターターキット兼リファレンスのデモ画面です。
				</p>
			</div>

			<div class="row g-3">
				<div class="col-md-4">
					<div class="card h-100">
						<div class="card-body">
							<h2 class="h5 card-title">社員管理</h2>
							<p class="card-text text-muted">
								社員情報の一覧・検索・登録・更新・削除を行う画面です。
							</p>
							<a class="btn btn-primary" th:href="@{/employee}">
								社員管理を開く
							</a>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
