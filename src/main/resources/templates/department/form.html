<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
	<meta charset="UTF-8">
	<title th:text="${mode == 'create'} ? '部署登録 | Practical App Starter' : '部署編集 | Practical App Starter'">部署登録・編集 | Practical App Starter</title>
	<th:block th:replace="~{fragments/css :: css}"></th:block>
</head>
<body>
	<th:block th:replace="~{fragments/header :: header}"></th:block>

	<div class="d-flex">
		<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

		<main class="app-main">
			<div class="department-page-header">
				<nav aria-label="パンくずリスト"
						th:replace="~{fragments/breadcrumb-department :: breadcrumb-department(${mode == 'create'} ? '部署登録' : '部署編集')}">
				</nav>
			</div>
			<h1 class="visually-hidden" th:text="${mode == 'create'} ? '部署登録' : '部署編集'">部署登録</h1>

			<div class="card department-form-card form-card-narrow">
				<div class="card-body">
					<form th:action="${mode == 'create'} ? @{/department} : @{/department/{id}(id=${departmentId})}"
							th:object="${departmentForm}"
							method="post">
						<div class="alert alert-danger py-2 mb-3" th:if="${#fields.hasGlobalErrors()}">
							<ul class="mb-0 ps-3">
								<li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
							</ul>
						</div>

						<div class="row department-form-grid department-form-grid--edit">
							<div class="col-12">
								<div class="row g-2 align-items-center">
									<label class="col-auto col-form-label col-form-label-sm form-label-fixed" for="departmentCode">
										部署コード <span class="text-danger">*</span>
									</label>
									<div class="col">
										<input type="text"
												class="form-control form-control-sm form-control-max"
												id="departmentCode"
												th:field="*{departmentCode}"
												th:classappend="${#fields.hasErrors('departmentCode')} ? 'is-invalid'">
										<div class="invalid-feedback" th:if="${#fields.hasErrors('departmentCode')}" th:errors="*{departmentCode}"></div>
									</div>
								</div>
							</div>
							<div class="col-12">
								<div class="row g-2 align-items-center">
									<label class="col-auto col-form-label col-form-label-sm form-label-fixed" for="departmentName">部署名 <span class="text-danger">*</span></label>
									<div class="col">
										<input type="text"
												class="form-control form-control-sm form-control-max"
												id="departmentName"
												th:field="*{departmentName}"
												th:classappend="${#fields.hasErrors('departmentName')} ? 'is-invalid'">
										<div class="invalid-feedback" th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}"></div>
									</div>
								</div>
							</div>
							<div class="col-12">
								<div class="row g-2 align-items-center">
									<label class="col-auto col-form-label col-form-label-sm form-label-fixed" for="displayOrder">表示順 <span class="text-danger">*</span></label>
									<div class="col">
										<input type="number"
												class="form-control form-control-sm form-control-max"
												id="displayOrder"
												min="0"
												step="1"
												th:field="*{displayOrder}"
												th:classappend="${#fields.hasErrors('displayOrder')} ? 'is-invalid'">
										<div class="invalid-feedback" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
									</div>
								</div>
							</div>
						</div>

						<div class="border-top border-opacity-10 mt-5 pt-3">
							<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 form-actions"
									th:if="${mode == 'edit'}">
								<button type="submit"
										class="btn btn-outline-danger btn-sm"
										form="department-delete-form"
										formmethod="post">削除</button>
								<div class="d-flex gap-2">
									<a class="btn btn-outline-secondary btn-form-action" th:href="@{/department}">一覧へ戻る</a>
									<button type="submit" class="btn btn-primary btn-form-action">更新</button>
								</div>
							</div>
							<div class="d-flex flex-wrap justify-content-end gap-2 form-actions" th:if="${mode == 'create'}">
								<a class="btn btn-outline-secondary btn-form-action" th:href="@{/department}">一覧へ戻る</a>
								<button type="submit" class="btn btn-primary btn-form-action">登録</button>
							</div>
						</div>
					</form>

					<form th:if="${mode == 'edit'}"
							id="department-delete-form"
							th:action="@{/department/{id}/delete(id=${departmentId})}"
							method="post"
							class="d-none"
							th:data-confirm-message="|${deleteConfirmDepartmentCode}：${deleteConfirmDepartmentName} を削除します。よろしいですか？|">
					</form>
				</div>
			</div>
		</main>
	</div>

	<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
	<script th:src="@{/js/department/form.js}"></script>
</body>
</html>
